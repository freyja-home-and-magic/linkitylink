[package]
name = "linkitylink"
version = "0.1.0"
description = "Linkitylink — one link card, shared anywhere"
authors = ["Freyja - Love and Magic"]
edition = "2021"

[lib]
name = "linkitylink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-share-sheet = { path = "tauri-plugin-share-sheet" }
tauri-plugin-app-group = { path = "tauri-plugin-app-group" }
tauri-plugin-identity-keychain = { path = "tauri-plugin-identity-keychain" }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bdo-rs = { path = "../../../allyabase/deployment/bdo/src/client/rust/bdo-rs" }
sessionless = "0.1.1"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
dom_query = "0.27"
